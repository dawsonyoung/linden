name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Supersede in-flight runs for the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # No go.sum yet; the module has no dependencies. Enable when one is added.
          cache: false

      - name: go vet
        run: cd src && go vet ./...

      - name: gofmt
        run: |
          unformatted=$(gofmt -l src)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reported unformatted files:"
            echo "$unformatted"
            exit 1
          fi

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Unit tests
        run: cd src && go test -race -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: cd src && go tool cover -func=coverage.out | tail -1

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Build server
        run: cd src && go build -o ../bin/linden ./cmd/

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Detect contract suite
        id: detect
        run: |
          if [ -f validation/go.mod ] && [ -n "$(find validation/contracts -name '*_test.go' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Suite not present
        if: steps.detect.outputs.present == 'false'
        run: |
          echo "::notice title=contract::No contract suite yet. Requires validation/go.mod and at least one _test.go file. Arrives in Stage A.1."

      - name: Contract tests
        if: steps.detect.outputs.present == 'true'
        run: cd validation && go test -tags=contracts -race ./contracts/...

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Detect integration suite
        id: detect
        run: |
          if [ -f validation/go.mod ] && [ -n "$(find validation/integration -name '*_test.go' -print -quit 2>/dev/null)" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Suite not present
        if: steps.detect.outputs.present == 'false'
        run: |
          echo "::notice title=integration::No integration suite yet. Arrives in Stage B.2."

      - name: Integration tests
        if: steps.detect.outputs.present == 'true'
        run: cd validation && go test -tags=integration -race ./integration/...

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect web project
        id: detect
        run: |
          if [ -f src/web/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Project not present
        if: steps.detect.outputs.present == 'false'
        run: |
          echo "::notice title=web::No src/web/package.json yet. Arrives in Stage C.3."

      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        if: steps.detect.outputs.present == 'true'
        run: cd src/web && npm ci

      - name: Type check
        if: steps.detect.outputs.present == 'true'
        run: cd src/web && npm run check

      - name: Build
        if: steps.detect.outputs.present == 'true'
        run: cd src/web && npm run build

  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build \
            --build-arg VERSION="${GITHUB_REF_NAME}" \
            --build-arg COMMIT="${GITHUB_SHA::7}" \
            -t linden:ci .

      - name: Verify non-root
        run: |
          user=$(docker image inspect linden:ci --format '{{.Config.User}}')
          echo "image user: ${user}"
          if [ -z "${user}" ] || [ "${user}" = "root" ] || [ "${user}" = "0" ]; then
            echo "::error::image runs as root"
            exit 1
          fi

      - name: Image size
        run: |
          bytes=$(docker image inspect linden:ci --format '{{.Size}}')
          echo "::notice title=image size::$(numfmt --to=iec "${bytes}")"

      - name: Start container
        run: docker run -d --name linden-smoke -p 8080:8080 linden:ci

      - name: Health endpoint returns 200
        run: |
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || true)
            if [ "${code}" = "200" ]; then
              echo "health returned 200 after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::health endpoint did not return 200 within 20s"
          docker logs linden-smoke
          exit 1

      - name: Version endpoint reports build args
        run: |
          body=$(curl -sf http://localhost:8080/version)
          echo "${body}"
          echo "${body}" | grep -q "${GITHUB_SHA::7}" || {
            echo "::error::version endpoint did not report the injected commit"
            exit 1
          }

      - name: Container healthcheck reports healthy
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' linden-smoke 2>/dev/null || echo unknown)
            if [ "${status}" = "healthy" ]; then
              echo "container healthcheck healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::container healthcheck never reported healthy"
          docker inspect --format '{{json .State.Health}}' linden-smoke || true
          exit 1

      # Verifies the graceful shutdown path deferred from Stage 0.2.
      # docker stop sends SIGTERM; the server must drain and log before exiting.
      - name: Graceful shutdown on SIGTERM
        run: |
          docker stop -t 15 linden-smoke
          logs=$(docker logs linden-smoke 2>&1)
          echo "${logs}"
          echo "${logs}" | grep -q "shutdown signal received" || {
            echo "::error::server did not report receiving the shutdown signal"
            exit 1
          }
          echo "${logs}" | grep -q "server stopped" || {
            echo "::error::server did not complete graceful shutdown"
            exit 1
          }

      - name: Container logs
        if: failure()
        run: docker logs linden-smoke || true

      - name: Clean up
        if: always()
        run: docker rm -f linden-smoke || true

