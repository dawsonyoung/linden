name: Deploy Documentation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  MDBOOK_VERSION: '0.4.40'

jobs:
  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Documentation integrity check
        run: make docs-check

      - name: Install mdBook
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${MDBOOK_VERSION}" --repo rust-lang/mdBook --pattern "*x86_64-unknown-linux-gnu.tar.gz" --dir /tmp --clobber
          tar -xzf /tmp/mdbook-*.tar.gz -C /usr/local/bin
          rm -f /tmp/mdbook-*.tar.gz
          mdbook --version

      - name: Build documentation
        run: mdbook build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/.site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
