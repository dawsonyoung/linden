name: Performance & Latency Regression

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  smoke-load-test:
    name: Smoke Load Test (Basic Regressions)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build Web UI
        run: |
          cd src/web
          npm ci
          npm run build

      - name: Compile Binary
        run: |
          cd src
          CGO_ENABLED=0 go build -trimpath -o ../linden ./cmd/

      - name: Start Linden Background Server
        run: |
          ./linden &
          echo $! > linden.pid
          # Wait for server to bind to port 8080
          sleep 3

      - name: Basic API Latency Smoke Test
        run: |
          echo "Testing /health endpoint latency under simulated load..."
          
          # Hit the server 50 times in rapid succession, track average time
          TOTAL_TIME=0
          for i in {1..50}; do
            START_TIME=$(date +%s%3N)
            curl -s http://localhost:8080/health > /dev/null
            END_TIME=$(date +%s%3N)
            LATENCY=$((END_TIME - START_TIME))
            TOTAL_TIME=$((TOTAL_TIME + LATENCY))
          done
          
          AVG_LATENCY=$((TOTAL_TIME / 50))
          echo "Average /health latency: ${AVG_LATENCY}ms"
          
          # Failsafe: if basic routing takes > 500ms on average on a github runner, there's a severe deadlock
          if [ $AVG_LATENCY -gt 500 ]; then
            echo "Regression detected: Average latency > 500ms"
            exit 1
          fi

      - name: Shutdown & Memory Check
        run: |
          PID=$(cat linden.pid)
          # Get memory usage in KB (RSS)
          MEM_KB=$(ps -p $PID -o rss=)
          MEM_MB=$((MEM_KB / 1024))
          echo "Idle memory footprint (w/ embedded assets): ${MEM_MB}MB"
          
          # Failsafe: if it uses > 250MB idle, there's a severe leak
          if [ $MEM_MB -gt 250 ]; then
            echo "Regression detected: Idle memory > 250MB"
            exit 1
          fi
          
          kill $PID
