name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write
  packages: write

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '22'

jobs:
  build-binaries:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Build Web UI Assets
        run: |
          cd src/web
          npm ci
          npm run build

      - name: Compile Static Linux Binaries
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          COMMIT: ${{ github.sha }}
        run: |
          mkdir -p dist
          SHORT_COMMIT=$(echo "${COMMIT}" | cut -c1-7)
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.commit=${SHORT_COMMIT}"

          echo "Building linux/amd64..."
          cd src
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "${LDFLAGS}" -o ../dist/linden-linux-amd64 ./cmd/

          echo "Building linux/arm64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "${LDFLAGS}" -o ../dist/linden-linux-arm64 ./cmd/
          cd ..

      - name: Generate Checksums
        run: |
          cd dist
          sha256sum linden-linux-amd64 linden-linux-arm64 > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.version }}
          name: Linden ${{ steps.vars.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            dist/linden-linux-amd64
            dist/linden-linux-arm64
            dist/checksums.txt
